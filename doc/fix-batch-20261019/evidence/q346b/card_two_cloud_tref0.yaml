# Two-cloud card used by check_d17_precip_copy.py and check_partition_tref0.py.
# Tref = 0; H2O => H2O(l) and NH3 => NH3(s) nucleation (disjoint, so uv-solver auto picks partition);
# each condensate has a precipitating copy X(p) with an identical card, made by coagulation.
# Condensate cv/u0 from the named saturation formulas: u0 = -beta*T3, cv = cv_vap + 1 + gamma.
reference-state:
  Tref: 0.
  Pref: 1.e5

species:
  - {name: dry, composition: {H: 1.6667, He: 0.16667}, cv_R: 2.5}
  - {name: H2O, composition: {H: 2, O: 1}, cv_R: 2.5, u0_R: 0.}
  - {name: NH3, composition: {N: 1, H: 3}, cv_R: 2.5, u0_R: 0.}
  - {name: 'H2O(l)', composition: {H: 2, O: 1}, cv_R: 8.486009, u0_R: -6786.6602}
  - {name: 'H2O(l,p)', composition: {H: 2, O: 1}, cv_R: 8.486009, u0_R: -6786.6602}
  - {name: 'NH3(s)', composition: {N: 1, H: 3}, cv_R: 4.93, u0_R: -4033.056}
  - {name: 'NH3(s,p)', composition: {N: 1, H: 3}, cv_R: 4.93, u0_R: -4033.056}

dynamics:
  equation-of-state: {type: ideal-moist, max-iter: 20, ftol: 1.e-6}

reactions:
  - {equation: H2O => H2O(l), type: nucleation, rate-constant: {formula: h2o_ideal}}
  - {equation: 'H2O(l) => H2O(l,p)', type: coagulation, rate-constant: {A: 1.e-5, b: 0, Ea_R: 0.}}
  - equation: H2O(l,p) => H2O
    type: evaporation
    rate-constant: {formula: h2o_ideal, diff_c: 0.2e-4, diff_T: 1.75, diff_P: -1., vm: 18.e-6, diameter: 1.0e-4}
  - {equation: NH3 => NH3(s), type: nucleation, rate-constant: {formula: nh3_ideal}}
  - {equation: 'NH3(s) => NH3(s,p)', type: coagulation, rate-constant: {A: 1.e-5, b: 0, Ea_R: 0.}}
  - equation: NH3(s,p) => NH3
    type: evaporation
    rate-constant: {formula: nh3_ideal, diff_c: 0.2e-4, diff_T: 1.75, diff_P: -1., vm: 20.8e-6, diameter: 1.0e-4}
